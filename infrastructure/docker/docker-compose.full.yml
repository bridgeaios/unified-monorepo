# ==============================================================================
# docker-compose.full.yml — complete unified-monorepo stack
#
# Active services:
#   api-gateway        -> http://localhost:4000   (Core Service, Node.js)
#   dashboard          -> http://localhost:3000   (Core Service, Node.js/Vite)
#
# Every discovered service category also has a commented placeholder block
# below. Uncomment and wire into the api-gateway proxy routes as projects are
# migrated into services/<name>.
#
# All containers attach to the shared `unified-net` bridge network so services
# reach each other by container name (e.g. http://api-gateway:4000).
#
# Generated alongside: scripts/discover/generate-docker.ps1 writes the
# per-service Dockerfiles under infrastructure/docker/<service>/Dockerfile and
# regenerates infrastructure/docker/docker-compose.yml.
# ==============================================================================

services:
  # --------------------------------------------------------------------------
  # Core services (active)
  # --------------------------------------------------------------------------
  api-gateway:
    build:
      context: ../../apps/api-gateway
      dockerfile: ../../infrastructure/docker/api-gateway/Dockerfile
    ports:
      - "4000:4000"
    networks:
      - unified-net
    environment:
      - PORT=4000
      - NODE_ENV=production
    volumes:
      - api-gateway_node_modules:/app/node_modules
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  dashboard:
    build:
      context: ../../apps/dashboard
      dockerfile: ../../infrastructure/docker/dashboard/Dockerfile
    ports:
      - "3000:3000"
    networks:
      - unified-net
    environment:
      - PORT=3000
      - NODE_ENV=production
      - VITE_API_URL=http://api-gateway:4000
    volumes:
      - dashboard_node_modules:/app/node_modules
    restart: unless-stopped
    depends_on:
      - api-gateway
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

