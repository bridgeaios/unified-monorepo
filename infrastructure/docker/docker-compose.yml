services:

  api-gateway:
    build:
      context: ../../apps/api-gateway
      dockerfile: ../../infrastructure/docker/api-gateway/Dockerfile
    ports:
      - "4000:4000"
    networks:
      - unified-net
    environment:
      - "PORT=4000"
      - "NODE_ENV=production"
    healthcheck:
      test: ["CMD","wget","--no-verbose","--tries=1","--spider","http://localhost:4000/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

